services:
  document-processor-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: document-processor-api:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DOCUMENT_OUTPUT_ROOT: /app/extracted
    volumes:
      - ./extracted:/app/extracted
      - ./diavgeia_sample:/app/extracted/diavgeia_sample:ro
    restart: unless-stopped
